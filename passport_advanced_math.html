<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAT Math Master Practice</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    
    <style>
        .option-btn { transition: all 0.2s; }
        .option-btn:hover { transform: translateY(-1px); }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        select { -webkit-appearance: none; appearance: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Main Container -->
    <div id="app" class="w-full max-w-3xl bg-white rounded-xl shadow-2xl overflow-hidden border border-slate-200 flex flex-col" style="min-height: 600px;">
        
        <!-- Header -->
        <header class="bg-indigo-700 text-white p-6 shadow-md z-10">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">SAT Math Master</h1>
                    <p class="text-indigo-200 text-sm">Interactive Practice & Review</p>
                </div>
                <!-- Home Button (Hidden on Start Screen) -->
                <button id="home-btn" onclick="goHome()" class="hidden text-xs bg-indigo-600 hover:bg-indigo-500 py-1 px-3 rounded border border-indigo-500 transition">
                    Change Topic
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 relative bg-white">
            
            <!-- 1. TOPIC SELECTION SCREEN -->
            <div id="start-screen" class="absolute inset-0 p-8 flex flex-col items-center justify-center text-center fade-in z-0 overflow-y-auto">
                <div class="mb-8 max-w-md">
                    <div class="inline-block p-4 rounded-full bg-indigo-50 text-indigo-600 mb-6 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800 mb-3">Select a Topic</h2>
                    <p class="text-slate-500 mb-8">Choose an Algebra 2 area to practice. Each session contains 15 questions.</p>
                    
                    <div class="relative text-left">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">Current Module</label>
                        <select id="topic-selector" class="block w-full bg-slate-50 border border-slate-300 text-slate-700 py-4 px-4 pr-8 rounded-lg leading-tight focus:outline-none focus:bg-white focus:border-indigo-500 shadow-sm text-lg cursor-pointer">
                            <option value="systems">1. Systems of Equations</option>
                            <option value="quadratics">2. Quadratic Functions & Equations</option>
                            <option value="polynomials">3. Polynomial Operations</option>
                            <option value="rational">4. Rational Expressions</option>
                            <option value="exponential">5. Exponential Functions</option>
                            <option value="radicals">6. Radical Expressions</option>
                            <option value="functions">7. Function Properties & Notation</option>
                            <option value="growth">8. Growth, Decay & Logarithms</option>
                            <option value="complex">9. Complex Numbers</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 pt-6 text-slate-500">
                            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                        </div>
                    </div>
                </div>

                <button onclick="startQuiz()" class="w-full max-w-xs bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-8 rounded-xl shadow-lg transform transition hover:scale-[1.02] flex items-center justify-center gap-2">
                    <span>Start Practice</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>

            <!-- 2. QUIZ INTERFACE -->
            <div id="quiz-interface" class="absolute inset-0 hidden flex flex-col bg-white z-20">
                <!-- Progress Bar -->
                <div class="w-full bg-slate-100 h-1">
                    <div id="progress-bar" class="bg-indigo-500 h-1 transition-all duration-300" style="width: 0%"></div>
                </div>

                <!-- Scrollable Content -->
                <div class="flex-1 overflow-y-auto p-6 md:p-10 pb-20">
                    <!-- Question Header -->
                    <div class="flex justify-between items-start mb-4">
                        <span class="inline-block bg-slate-100 text-slate-500 text-xs font-bold px-2 py-1 rounded uppercase tracking-wider">
                            Q<span id="current-q-num">1</span> <span class="text-slate-300 mx-1">/</span> <span id="total-q-num">15</span>
                        </span>
                        <button onclick="toggleHint()" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-1 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            Hint
                        </button>
                    </div>

                    <!-- Hint Box -->
                    <div id="hint-box" class="hidden bg-amber-50 border-l-4 border-amber-400 p-4 mb-6 rounded text-sm text-amber-800 fade-in shadow-sm">
                        <span class="font-bold block mb-1">💡 Hint</span> 
                        <span id="hint-text"></span>
                    </div>

                    <!-- Image Container -->
                    <div id="image-container" class="mb-6 hidden flex justify-center bg-slate-50 rounded-lg p-4 border border-slate-100"></div>

                    <!-- Question Text -->
                    <div id="question-text" class="text-xl md:text-2xl font-medium text-slate-800 mb-8 leading-relaxed"></div>

                    <!-- Options Grid -->
                    <div id="options-container" class="grid gap-4 max-w-2xl mx-auto">
                        <!-- Options injected by JS -->
                    </div>

                    <!-- Feedback Section -->
                    <div id="feedback-section" class="hidden mt-8 pt-6 border-t border-slate-100 fade-in bg-slate-50 rounded-xl p-6">
                        <div class="flex items-center gap-3 mb-3">
                            <div id="feedback-icon" class="rounded-full p-1"></div>
                            <div id="feedback-header" class="font-bold text-lg"></div>
                        </div>
                        <div id="feedback-rationale" class="text-slate-600 text-base leading-relaxed mb-6 pl-1"></div>
                        <button id="next-btn" onclick="nextQuestion()" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-4 px-6 rounded-lg shadow-lg transition flex justify-center items-center gap-2">
                            Next Question
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 3. RESULTS SCREEN -->
            <div id="results-screen" class="absolute inset-0 hidden p-8 overflow-y-auto bg-slate-50 z-30 flex flex-col items-center">
                <div class="text-center w-full max-w-2xl">
                    <div class="mb-2 text-indigo-600 font-bold uppercase tracking-widest text-xs">Topic Complete</div>
                    <h2 id="result-title" class="text-3xl font-bold mb-6 text-slate-900">Summary</h2>
                    
                    <!-- Score Card -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 mb-8 flex flex-col items-center">
                        <div class="text-6xl font-black text-slate-800 mb-2">
                            <span id="final-score">0</span><span class="text-3xl text-slate-400 font-medium">/15</span>
                        </div>
                        <div id="final-percent" class="text-sm font-bold bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full mb-4">0%</div>
                        <p id="final-message" class="text-slate-600">Loading...</p>
                    </div>

                    <div class="text-left w-full">
                        <h3 class="font-bold text-slate-700 mb-4 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-500" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                            </svg>
                            Detailed Analysis
                        </h3>
                        <div id="analysis-content" class="space-y-4 text-sm text-slate-600 pb-12">
                            <!-- Analysis Items -->
                        </div>
                    </div>

                    <!-- Fixed Bottom Bar for Results -->
                    <div class="fixed bottom-0 left-0 right-0 bg-white p-4 border-t border-slate-200 flex justify-center md:absolute md:bottom-auto md:relative md:bg-transparent md:border-0 md:p-0">
                        <button onclick="goHome()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg w-full md:w-auto">
                            Finish & Choose New Topic
                        </button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- APP LOGIC -->
    <script>
        // --- 1. DATA STORE (The Content Engine) ---
        
        const masterData = {
            functions: [
                {
                    q: "If $f(x) = 2x - 3$, what is $f(f(2))$?",
                    options: ["$-1$", "$1$", "$2$", "$-5$"],
                    correct: 0,
                    rationale: "First find $f(2) = 2(2) - 3 = 1$. Then find $f(1) = 2(1) - 3 = -1$.",
                    hint: "Work from the inside out."
                },
                {
                    q: "What is the inverse function of $f(x) = 3x + 1$?",
                    options: ["$f^{-1}(x) = \\frac{x-1}{3}$", "$f^{-1}(x) = \\frac{x}{3} - 1$", "$f^{-1}(x) = 3x - 1$", "$f^{-1}(x) = \\frac{x+1}{3}$"],
                    correct: 0,
                    rationale: "Swap x and y: $x = 3y + 1$. Solve for y: $x - 1 = 3y \\rightarrow y = \\frac{x-1}{3}$.",
                    hint: "Swap x and y, then solve for the new y."
                },
                {
                    q: "Domain of $f(x) = \\frac{1}{\\sqrt{x-2}}$?",
                    options: ["$x > 2$", "$x \\ge 2$", "$x \\neq 2$", "$x > 0$"],
                    correct: 0,
                    rationale: "Radicand must be non-negative ($x-2 \\ge 0$) AND denominator non-zero ($x-2 \\neq 0$). So $x-2 > 0 \\rightarrow x > 2$.",
                    hint: "Consider both the square root and the fraction restrictions."
                },
                {
                    q: "If the graph of $y=f(x)$ is shifted right 3 and down 2, what is the new equation?",
                    options: ["$y = f(x-3) - 2$", "$y = f(x+3) - 2$", "$y = f(x-3) + 2$", "$y = f(x+3) + 2$"],
                    correct: 0,
                    rationale: "Right shift affects $x$ as $(x-h)$, so $(x-3)$. Down shift affects $y$ directly, so $-2$.",
                    hint: "Inside change is opposite (horizontal), outside is direct (vertical)."
                },
                {
                    q: "If $f(x) = x^2$ and $g(x) = x - 1$, find $f(g(x))$.",
                    options: ["$(x-1)^2$", "$x^2 - 1$", "$x^2 - 2x$", "$x^2 + 1$"],
                    correct: 0,
                    rationale: "Substitute $g(x)$ into $f$: $f(x-1) = (x-1)^2$.",
                    hint: "Plug the entire expression for $g(x)$ into $f(x)$."
                },
                {
                    q: "Which function is even?",
                    options: ["$f(x) = x^2 + 1$", "$f(x) = x^3$", "$f(x) = x + 1$", "$f(x) = 2x$"],
                    correct: 0,
                    rationale: "A function is even if $f(-x) = f(x)$. $(-x)^2 + 1 = x^2 + 1$. Symmetric over y-axis.",
                    hint: "Even functions have symmetry across the y-axis."
                },
                {
                    q: "Find the x-intercept of $f(x) = 2x - 8$.",
                    options: ["$4$", "$-8$", "$-4$", "$0$"],
                    correct: 0,
                    rationale: "Set $y=0$: $0 = 2x - 8 \\rightarrow 8 = 2x \\rightarrow x = 4$.",
                    hint: "Set the function value to 0 and solve for x."
                },
                {
                    q: "If $f(x) = 3^x$, what is $f(0)$?",
                    options: ["$1$", "$0$", "$3$", "Undefined"],
                    correct: 0,
                    rationale: "Any non-zero base to the power of 0 is 1.",
                    hint: "Exponent rule for power of 0."
                },
                {
                    q: "If $(3, 5)$ is on the graph of $f(x)$, what point is on $y = f(x-2)$?",
                    options: ["$(5, 5)$", "$(1, 5)$", "$(3, 3)$", "$(3, 7)$"],
                    correct: 0,
                    rationale: "$f(x-2)$ shifts Right 2. So $x$ increases by 2. $(3+2, 5) = (5, 5)$.",
                    hint: "Horizontal shift affects the x-coordinate."
                },
                {
                    q: "If $f(x) = 2x + 1$ and $g(x) = 3x$, solve $f(x) = g(x)$.",
                    options: ["$1$", "$0$", "$-1$", "$0.5$"],
                    correct: 0,
                    rationale: "$2x + 1 = 3x \\rightarrow 1 = x$.",
                    hint: "Set the expressions equal to each other."
                },
                {
                    q: "Range of $f(x) = x^2 + 3$.",
                    options: ["$y \\ge 3$", "$y > 3$", "$y \\ge 0$", "All real numbers"],
                    correct: 0,
                    rationale: "$x^2 \\ge 0$, so $x^2 + 3 \\ge 3$.",
                    hint: "What is the minimum value of $x^2$?"
                },
                {
                    q: "If $f(g(x)) = x$, then $g(x)$ is the ___ of $f(x)$.",
                    options: ["Inverse", "Reciprocal", "Derivative", "Composite"],
                    correct: 0,
                    rationale: "This is the definition of inverse functions.",
                    hint: "Functions that 'undo' each other."
                },
                {
                    q: "Value of $k$ if $(2, k)$ lies on $y = 3x - 4$.",
                    options: ["$2$", "$10$", "$6$", "$-2$"],
                    correct: 0,
                    rationale: "$k = 3(2) - 4 = 6 - 4 = 2$.",
                    hint: "Substitute x=2 and solve for y."
                },
                {
                    q: "Which represents a reflection over the x-axis?",
                    options: ["$-f(x)$", "$f(-x)$", "$f(x)^{-1}$", "$1/f(x)$"],
                    correct: 0,
                    rationale: "Negating the output flips the graph vertically (over x-axis).",
                    hint: "Change the sign of the y-values."
                },
                {
                    q: "If $f(x) = \\sqrt{x}$ and $g(x) = x - 4$, domain of $f(g(x))$.",
                    options: ["$x \\ge 4$", "$x \\ge 0$", "$x > 4$", "$x \\neq 4$"],
                    correct: 0,
                    rationale: "$f(g(x)) = \\sqrt{x-4}$. Inside must be $\\ge 0$: $x-4 \\ge 0 \\rightarrow x \\ge 4$.",
                    hint: "Find the composite function first, then check domain."
                }
            ],
            growth: [
                {
                    q: "Convert $3^2 = 9$ to logarithmic form.",
                    options: ["$\\log_3 9 = 2$", "$\\log_9 3 = 2$", "$\\log_2 9 = 3$", "$\\log_3 2 = 9$"],
                    correct: 0,
                    rationale: "Base 3 remains base. Log equals the exponent. $\\log_3 9 = 2$.",
                    hint: "Base stays the base, logarithm equals the exponent."
                },
                {
                    q: "Population grows 10% per year. Which model fits?",
                    options: ["$y = a(1.10)^t$", "$y = a(0.90)^t$", "$y = a(0.10)^t$", "$y = a(10)^t$"],
                    correct: 0,
                    rationale: "Growth means $1 + r$. $1 + 0.10 = 1.10$.",
                    hint: "Growth factor is $1 +$ rate."
                },
                {
                    q: "Evaluate $\\log_2 8$.",
                    options: ["$3$", "$4$", "$2$", "$8$"],
                    correct: 0,
                    rationale: "$2^x = 8$. Since $2^3 = 8$, the log is 3.",
                    hint: "2 raised to what power is 8?"
                },
                {
                    q: "Solve $e^x = 5$.",
                    options: ["$x = \\ln 5$", "$x = 5e$", "$x = \\log 5$", "$x = 5/e$"],
                    correct: 0,
                    rationale: "Take natural log ($\ln$) of both sides. $x = \ln 5$.",
                    hint: "Use natural logarithm to undo base $e$."
                },
                {
                    q: "Simplify $\\log x + \\log y$.",
                    options: ["$\\log(xy)$", "$\\log(x+y)$", "$\\log(x/y)$", "$(\\log x)(\\log y)$"],
                    correct: 0,
                    rationale: "Product rule: sum of logs is log of product.",
                    hint: "Log rule: addition becomes multiplication inside."
                },
                {
                    q: "Half-life is 5 years. Amount after 15 years starting with 100g?",
                    options: ["$12.5$ g", "$25$ g", "$6.25$ g", "$50$ g"],
                    correct: 0,
                    rationale: "15 years is 3 half-lives ($15/5$). $100 \\rightarrow 50 \\rightarrow 25 \\rightarrow 12.5$.",
                    hint: "Cut in half 3 times."
                },
                {
                    q: "Solve $\\log_x 25 = 2$.",
                    options: ["$5$", "$50$", "$12.5$", "$2.5$"],
                    correct: 0,
                    rationale: "Rewrite as exponential: $x^2 = 25$. Since base must be positive, $x = 5$.",
                    hint: "Rewrite in exponential form: $base^{exp} = result$."
                },
                {
                    q: "If $y = 100(0.85)^t$, what is the decay rate?",
                    options: ["15%", "85%", "0.15%", "1.5%"],
                    correct: 0,
                    rationale: "Base is $1 - r$. $0.85 = 1 - r \\rightarrow r = 0.15 = 15\\%$.",
                    hint: "Find difference between 1 and the base."
                },
                {
                    q: "Simplify $2 \\log x$.",
                    options: ["$\\log(x^2)$", "$\\log(2x)$", "$(\\log x)^2$", "$\\log(x+2)$"],
                    correct: 0,
                    rationale: "Power rule: coefficient becomes exponent.",
                    hint: "Move the number in front to the exponent."
                },
                {
                    q: "Evaluate $\\log_{10} 1000$.",
                    options: ["$3$", "$10$", "$100$", "$0.3$"],
                    correct: 0,
                    rationale: "$10^3 = 1000$.",
                    hint: "Count the zeros."
                },
                {
                    q: "Which graph has an asymptote at $y=0$?",
                    options: ["$y = 2^x$", "$y = x^2$", "$y = x$", "$y = \\log x$"],
                    correct: 0,
                    rationale: "Exponential functions have horizontal asymptotes. Log functions have vertical ones.",
                    hint: "Exponential functions flatten out horizontally."
                },
                {
                    q: "Solve $3^{2x} = 27$.",
                    options: ["$1.5$", "$3$", "$1$", "$2$"],
                    correct: 0,
                    rationale: "$27 = 3^3$. So $3^{2x} = 3^3 \\rightarrow 2x = 3 \\rightarrow x = 1.5$.",
                    hint: "Match the bases."
                },
                {
                    q: "Value of $\\ln 1$.",
                    options: ["$0$", "$1$", "$e$", "Undefined"],
                    correct: 0,
                    rationale: "$e^0 = 1$. Log of 1 is always 0.",
                    hint: "$e$ to what power is 1?"
                },
                {
                    q: "Interest compounded continuously: $A = Pe^{rt}$. If $r=0.05, t=2$, exponent is:",
                    options: ["$0.1$", "$0.025$", "$1.1$", "$0.25$"],
                    correct: 0,
                    rationale: "$rt = 0.05(2) = 0.1$.",
                    hint: "Multiply rate by time."
                },
                {
                    q: "Which is larger: $\\log_2 16$ or $\\log_3 27$?",
                    options: ["$\\log_2 16$", "$\\log_3 27$", "Equal", "Cannot tell"],
                    correct: 0,
                    rationale: "$\\log_2 16 = 4$ ($2^4=16$). $\\log_3 27 = 3$ ($3^3=27$). 4 > 3.",
                    hint: "Evaluate each logarithm."
                }
            ],
            rational: [
                {
                    q: "Solve for $x$: $\\frac{2}{x} + \\frac{1}{2} = \\frac{7}{2x}$",
                    options: ["$3$", "$5$", "$2$", "$4$"],
                    correct: 0,
                    rationale: "Multiply by LCD $2x$: $2(2) + x = 7 \\rightarrow 4 + x = 7 \\rightarrow x = 3$.",
                    hint: "Multiply every term by $2x$ to clear the fractions."
                },
                {
                    q: "For what value of $x$ is the expression $\\frac{x-2}{x^2-9}$ undefined?",
                    options: ["$3$ and $-3$", "$3$ only", "$2$ only", "$-3$ only"],
                    correct: 0,
                    rationale: "Undefined when denominator is zero. $x^2 - 9 = 0 \\rightarrow (x-3)(x+3)=0$.",
                    hint: "Set the denominator equal to zero."
                },
                {
                    q: "Simplify: $\\frac{x^2+4x+4}{x^2-4}$",
                    options: ["$\\frac{x+2}{x-2}$", "$\\frac{x-2}{x+2}$", "$x+2$", "$\\frac{x+2}{x+4}$"],
                    correct: 0,
                    rationale: "Factor: $\\frac{(x+2)(x+2)}{(x+2)(x-2)}$. Cancel $(x+2)$. Result $\\frac{x+2}{x-2}$.",

                },
                {
                    q: "Solve: $\\frac{3}{x+1} = \\frac{2}{x-1}$",

                    correct: 0,
                    rationale: "Cross multiply: $3(x-1) = 2(x+1) \\rightarrow 3x - 3 = 2x + 2 \\rightarrow x = 5$.",

                },
                {
                    q: "Simplify $\\frac{2}{x} - \\frac{3}{2x}$",

                    rationale: "Common denominator is $2x$. Convert first term: $\\frac{4}{2x} - \\frac{3}{2x} = \\frac{1}{2x}$.",

                {
                    q: "If $f(x) = \\frac{1}{x-1}$, what is $f(3)$?",
                    options: ["$0.5$", "$1$", "$2$", "$0$"],
                    correct: 0,
                    rationale: "Substitute $x=3$: $\\frac{1}{3-1} = \\frac{1}{2} = 0.5$.",
                    hint: "Plug in 3 for x."
                },
                {
                    q: "Which expression is equivalent to $\\frac{1}{\\frac{1}{a} + \\frac{1}{b}}$?",
                    options: ["$\\frac{ab}{a+b}$", "$a+b$", "$\\frac{a+b}{ab}$", "$ab$"],
                    correct: 0,
                    rationale: "Denominator becomes $\\frac{b+a}{ab}$. Reciprocal is $\\frac{ab}{a+b}$.",

                {

                    correct: 0,

                {

                {
                    q: "Which is a factor of $x^3 - 8$?",

                    correct: 0,

                    hint: "Difference of cubes formula."
                },
                {
                    q: "If $x-1$ is a factor of $x^3 + kx^2 + x - 2$, find $k$.",
                    options: ["$0$", "$1$", "$-1$", "$2$"],
                    correct: 0,

            // Add other categories here (polynomials, rational, etc.)
            // The logic below will handle them if data exists.
        };

        // --- 2. STATE & UTILS ---
        let currentTopic = 'quadratics';
        let currentQIndex = 0;
        let score = 0;
        let userAnswers = [];
        let isAnswered = false;

        // Populate placeholders for other topics so app doesn't crash if selected
        // In a real scenario, you would paste 15 questions for each.
        const topics = ['functions', 'growth'];
        topics.forEach(t => {
            if (!masterData[t]) {
                masterData[t] = [
                    {
                        q: "Sample Question: This topic needs more questions added to the code.",
                        options: ["Option A", "Option B", "Option C", "Option D"],
                        correct: 0,
                        rationale: "You can edit the HTML file to add 15 questions for this topic in the `masterData` object.",
                        hint: "Check the source code."
                    }
                ];
            }
        });

        const els = {
            app: document.getElementById('app'),
            screens: {
                start: document.getElementById('start-screen'),
                quiz: document.getElementById('quiz-interface'),
                results: document.getElementById('results-screen')
            },
            homeBtn: document.getElementById('home-btn'),
            selector: document.getElementById('topic-selector'),
            progress: document.getElementById('progress-bar'),
            qNum: document.getElementById('current-q-num'),
            totalQ: document.getElementById('total-q-num'),
            qText: document.getElementById('question-text'),
            options: document.getElementById('options-container'),
            hintBox: document.getElementById('hint-box'),
            hintText: document.getElementById('hint-text'),
            feedback: document.getElementById('feedback-section'),
            feedbackHeader: document.getElementById('feedback-header'),
            feedbackIcon: document.getElementById('feedback-icon'),
            feedbackRationale: document.getElementById('feedback-rationale'),
            nextBtn: document.getElementById('next-btn'),
            results: {
                title: document.getElementById('result-title'),
                score: document.getElementById('final-score'),
                percent: document.getElementById('final-percent'),
                msg: document.getElementById('final-message'),
                analysis: document.getElementById('analysis-content')
            }
        };

        // --- 3. CORE FUNCTIONS ---

        function initMath() {
            if (typeof renderMathInElement !== 'undefined') {
                renderMathInElement(document.body, {
                    delimiters: [
                        {left: "$$", right: "$$", display: true},
                        {left: "$", right: "$", display: false}
                    ]
                });
            }
        }

        // Add init to window load
        window.addEventListener('DOMContentLoaded', initMath);

        function goHome() {
            showScreen('start');
            els.homeBtn.classList.add('hidden');
        }

        function showScreen(name) {
            Object.values(els.screens).forEach(s => s.classList.add('hidden'));
            els.screens[name].classList.remove('hidden');
        }

        function startQuiz() {
            currentTopic = els.selector.value;
            currentQIndex = 0;
            score = 0;
            userAnswers = [];
            isAnswered = false;

            // Set total questions display
            els.totalQ.textContent = masterData[currentTopic].length;

            showScreen('quiz');
            els.homeBtn.classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            isAnswered = false;
            els.feedback.classList.add('hidden');
            els.hintBox.classList.add('hidden');

            const data = masterData[currentTopic];
            const q = data[currentQIndex];

            // Progress
            const progressPct = (currentQIndex / data.length) * 100;
            els.progress.style.width = `${progressPct}%`;
            els.qNum.textContent = currentQIndex + 1;

            // Content
            els.qText.innerHTML = q.q;
            els.hintText.innerHTML = q.hint;

            // Options Shuffle
            const indices = q.options.map((_, i) => i);
            // Simple shuffle
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }

            // Render Options
            els.options.innerHTML = '';
            indices.forEach(i => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-left p-5 rounded-xl border-2 border-slate-200 hover:border-indigo-500 hover:bg-indigo-50 transition bg-white shadow-sm flex items-center group";
                btn.innerHTML = `
                    <span class="flex items-center justify-center w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold text-sm mr-4 group-hover:bg-indigo-200 group-hover:text-indigo-700 transition">${String.fromCharCode(65 + indices.indexOf(i))}</span>
                    <span class="text-lg text-slate-700 flex-1">${q.options[i]}</span>
                `;
                btn.onclick = () => checkAnswer(i, btn, indices);
                els.options.appendChild(btn);
            });

            // Update Next Button Text
            els.nextBtn.innerHTML = (currentQIndex === data.length - 1) 
                ? 'Finish Practice <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>'
                : 'Next Question <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>';

            initMath();
        }

        function toggleHint() {
            els.hintBox.classList.toggle('hidden');
        }

        function checkAnswer(selectedIndex, btn, indices) {
            if (isAnswered) return;
            isAnswered = true;

            const data = masterData[currentTopic];
            const q = data[currentQIndex];
            const isCorrect = selectedIndex === q.correct;

            if (isCorrect) score++;
            userAnswers.push({ qIndex: currentQIndex, correct: isCorrect, selected: selectedIndex });

            // UI Feedback on Options
            const buttons = els.options.children;
            Array.from(buttons).forEach((b, idx) => {
                b.disabled = true;
                b.classList.remove('hover:border-indigo-500', 'hover:bg-indigo-50');
                const realIndex = indices[idx];
                
                if (realIndex === q.correct) {
                    b.classList.add('border-green-500', 'bg-green-50');
                    b.querySelector('span:first-child').classList.add('bg-green-200', 'text-green-800');
                } else if (b === btn && !isCorrect) {
                    b.classList.add('border-red-500', 'bg-red-50');
                    b.querySelector('span:first-child').classList.add('bg-red-200', 'text-red-800');
                } else {
                    b.classList.add('opacity-50');
                }
            });

            // Feedback Section
            els.feedback.classList.remove('hidden');
            els.feedbackIcon.className = isCorrect ? "rounded-full p-1 bg-green-100 text-green-600" : "rounded-full p-1 bg-red-100 text-red-600";
            els.feedbackIcon.innerHTML = isCorrect 
                ? '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>'
                : '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>';
            
            els.feedbackHeader.textContent = isCorrect ? "Correct!" : "Incorrect";
            els.feedbackHeader.className = isCorrect ? "font-bold text-lg text-green-700" : "font-bold text-lg text-red-700";
            els.feedbackRationale.innerHTML = q.rationale;
            
            // Auto scroll to feedback
            els.feedback.scrollIntoView({ behavior: 'smooth', block: 'start' });
            initMath();
        }

        function nextQuestion() {
            const data = masterData[currentTopic];
            if (currentQIndex < data.length - 1) {
                currentQIndex++;
                renderQuestion();
                // Scroll top
                els.screens.quiz.querySelector('.overflow-y-auto').scrollTop = 0;
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            const data = masterData[currentTopic];
            showScreen('results');
            els.homeBtn.classList.add('hidden');

            const pct = Math.round((score / data.length) * 100);
            
            // Score Display
            els.results.score.textContent = score;
            els.results.percent.textContent = `${pct}%`;
            
            // Message
            let msg = "";
            if (pct >= 90) msg = "Excellent mastery! You're ready for the next topic.";
            else if (pct >= 70) msg = "Great job! Review the mistakes below to reach 100%.";
            else msg = "Good practice. Let's review the concepts and try again.";
            els.results.msg.textContent = msg;

            // Analysis Generation
            els.results.analysis.innerHTML = '';
            
            // Loop through all questions to show summary
            data.forEach((q, idx) => {
                const ua = userAnswers.find(a => a.qIndex === idx);
                const isCorrect = ua ? ua.correct : false; // Handle skipped if any logic changed
                
                const item = document.createElement('div');
                item.className = `p-4 rounded-lg border ${isCorrect ? 'border-green-200 bg-green-50' : 'border-red-200 bg-red-50'}`;
                
                item.innerHTML = `
                    <div class="flex items-start gap-3">
                        <div class="mt-1 min-w-[24px]">
                            ${isCorrect 
                                ? '<div class="w-6 h-6 rounded-full bg-green-200 text-green-700 flex items-center justify-center font-bold text-xs">✓</div>' 
                                : '<div class="w-6 h-6 rounded-full bg-red-200 text-red-700 flex items-center justify-center font-bold text-xs">✗</div>'
                            }
                        </div>
                        <div class="flex-1">
                            <div class="text-slate-800 font-medium mb-1">Q${idx + 1}: ${q.q}</div>
                            ${!isCorrect ? `<div class="text-xs text-red-600 font-bold uppercase mb-1">Correct Answer: ${q.options[q.correct]}</div>` : ''}
                            <div class="text-slate-600 text-sm mt-2 border-t ${isCorrect ? 'border-green-200' : 'border-red-200'} pt-2">
                                <span class="font-bold text-xs uppercase opacity-70">Explanation:</span> ${q.rationale}
                            </div>
                        </div>
                    </div>
                `;
                els.results.analysis.appendChild(item);
            });
            
            initMath();
        }

    </script>
